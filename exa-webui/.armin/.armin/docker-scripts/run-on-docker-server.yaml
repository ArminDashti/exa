# Remote deploy settings - YAML only (no CLI flags).
# Behind HAProxy: exar-webui:80 + exar-api:8080 (no host publish required).

stack_name: exar
image_tag: exar-web:latest
compose_file: ../../docker-compose.yml
dockerfile: ../../dockerfile
docker_network: t3-net
internal_port: "8080"
publish_port: ""
delete_volume: "no"
delete_image: "yes"
build_image_on: "local"

ssh: "ssh t3 -p 80"

volume_dir: "/home/cloud-admin/docker/exar"
