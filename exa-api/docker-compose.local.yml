# Local Docker hot-reload: Postgres + Go Air API + Vite WebUI (bind mounts).
# Usage: docker compose -f docker-compose.local.yml -p exa up -d --force-recreate
name: exa
services:
  postgres:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: exa
      POSTGRES_PASSWORD: exa
      POSTGRES_DB: exa
    ports:
      - "5457:5432"
    volumes:
      - exa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exa -d exa"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: golang:1.23-bookworm
    restart: "no"
    working_dir: /app
    environment:
      ADDR: "0.0.0.0:8080"
      DATABASE_URL: postgres://exa:exa@postgres:5432/exa?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      MIGRATIONS_DIR: migrations
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5197,http://127.0.0.1:5197,http://pc-armin}
      GIN_MODE: debug
      GOTOOLCHAIN: auto
      GOCACHE: /app/tmp/gocache
    command:
      - sh
      - -c
      - apt-get update && apt-get install -y --no-install-recommends git gcc libc6-dev && rm -rf /var/lib/apt/lists/* && go install github.com/air-verse/air@v1.61.7 && air -c .air.toml
    volumes:
      - .:/app
      - C:/Users/armin/go/pkg/mod:/go/pkg/mod
      - exa-gotmp:/app/tmp
    ports:
      - "8197:8080"
    depends_on:
      postgres:
        condition: service_healthy

  webui:
    image: node:22-alpine
    restart: "no"
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_BASE_PATH: "/exa/"
      VITE_HMR_CLIENT_PORT: "80"
      VITE_API_PROXY_TARGET: http://api:8080
    command:
      - sh
      - -c
      - npm install && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    volumes:
      - ../exa-webui:/app
      - exa-webui-node-modules:/app/node_modules
    ports:
      - "5197:5173"
    networks:
      - default
      - pc-armin-local
    depends_on:
      - api

volumes:
  exa-postgres-data:
    external: true
    name: exa-api_exa_pgdata
  exa-gotmp:
  exa-webui-node-modules:

networks:
  pc-armin-local:
    external: true
